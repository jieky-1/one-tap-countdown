name: iOS Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project OneTapCountdown.xcodeproj \
            -target CountdownClock \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Export errors to job summary
        if: failure()
        run: |
          {
            echo '### xcodebuild 报错摘要'
            echo '```'
            grep -E "error:|xcodebuild: error|BUILD FAILED|The following build commands failed" build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
