name: iOS Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project OneTapCountdown.xcodeproj \
            -target CountdownClock \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Export errors to job summary
        if: failure()
        run: |
          {
            echo '### xcodebuild 报错摘要'
            echo '```'
            grep -E "error:|xcodebuild: error|BUILD FAILED|The following build commands failed" build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push build log to ci-logs branch
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git checkout -B ci-logs
          cp build.log build-log.txt
          git add build-log.txt
          git commit -m "build log for run $GITHUB_RUN_ID"
          git push -f origin ci-logs
