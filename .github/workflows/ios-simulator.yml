name: iOS Simulator Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project OneTapCountdown.xcodeproj \
            -target CountdownClock \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            SYMROOT="$GITHUB_WORKSPACE/SymBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Pick or create an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | .value[]
                      | select(.isAvailable == true)
                      | select(.name | test("^iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            RT=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.name | test("^iOS"))][-1].identifier')
            DT=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.identifier | test("iPhone-15"))][0].identifier')
            UDID=$(xcrun simctl create "CI iPhone" "$DT" "$RT")
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Install app
        run: |
          APP=$(find "$GITHUB_WORKSPACE/SymBuild" -type d -name "CountdownClock.app" | head -1)
          echo "app: $APP"
          xcrun simctl install booted "$APP"

      - name: Run UI test cases
        run: |
          set +e
          mkdir -p shots

          run_case() {
            name=$1; wait=$2; shift 2
            # --terminate-running-process：一步完成“杀旧 + 起新”
            ( xcrun simctl launch --terminate-running-process booted com.example.OneTapCountdown "$@" >/dev/null 2>&1 & )
            sleep "$wait"
            xcrun simctl io booted screenshot "shots/$name.png"
            echo "shot: $name  args: $*"
          }

          # 预热：首次冷启动较慢，先起一次再杀掉
          ( xcrun simctl launch booted com.example.OneTapCountdown >/dev/null 2>&1 & )
          sleep 10
          xcrun simctl terminate booted com.example.OneTapCountdown
          sleep 3

          # T1 主界面-日间（开始 = now+30min，结束 = now+1h）
          NOW=$(date +%s)
          run_case 01-main-day 10 -start "$(date -r $((NOW+1800)) +%H:%M)"

          # T2 主界面-夜间（02:30 在默认夜间区间内，默认 8 小时）
          run_case 02-main-night 6 -start 02:30

          # T2b 跨日结束时刻（开始 23:30=昨天，时长使结束 ≈ now+2h）
          TODAY0=$(date -j -f "%Y-%m-%d %H:%M:%S" "$(date +%Y-%m-%d) 00:00:00" +%s)
          NOW=$(date +%s)
          DUR2B=$(( (NOW + 7200 - (TODAY0 - 1800)) / 60 ))
          run_case 02b-crossday 6 -start 23:30 -duration "$DUR2B"

          # T3 输入模式
          NOW=$(date +%s)
          run_case 03-input-mode 8 -start "$(date -r $((NOW+1800)) +%H:%M)" -inputmode keyboard

          # T4a/T4b 设置页（关闭开关的用例放最后，避免污染后续用例）
          run_case 04a-settings-interval 6 -sheet night
          run_case 04b-settings-duration 6 -sheet duration

          # T5 已超时（开始 = now-30min，时长 5min）
          NOW=$(date +%s)
          run_case 05-overtime 6 -start "$(date -r $((NOW-1800)) +%H:%M)" -duration 5

          # T6 倒计时运行（结束 ≈ now+60s）
          NOW=$(date +%s)
          run_case 06-running 6 -start "$(date -r $((NOW-60)) +%H:%M)" -duration 2 -autostart

          # T7 到点算术题（结束 ≈ now+30s，等 50s 后已弹窗）
          NOW=$(date +%s)
          run_case 07-finished 50 -start "$(date -r $((NOW-90)) +%H:%M)" -duration 2 -autostart

          # T8 手动时长 1.5 小时
          NOW=$(date +%s)
          run_case 08-custom-duration 6 -start "$(date -r $((NOW+1800)) +%H:%M)" -duration 90

          # T4c 设置页-关闭态（放最后）
          run_case 04c-settings-off 6 -sheet night -nightoff
          ls -l shots

      - name: Publish artifacts to ci-artifacts branch
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git checkout -B ci-artifacts
          mkdir -p out
          cp shots/*.png out/ 2>/dev/null || true
          [ -f build.log ] && cp build.log out/build.log
          git add -A out
          git commit -m "UI test shots run $GITHUB_RUN_ID" || echo "nothing to commit"
          git push -f origin ci-artifacts
