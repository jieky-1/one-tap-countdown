name: iOS Simulator Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      start_time:
        description: '倒计时开始(HH:mm)，留空=当前时间。例：08:00'
        required: false
        default: ''
      duration_min:
        description: '倒计时时长(分钟)，留空=按默认。例：10'
        required: false
        default: ''
      auto_start:
        description: '启动后直接进入倒计时页面'
        type: boolean
        default: false
      wait1:
        description: '第 1 张截图：启动后等待秒数'
        required: false
        default: '4'
      wait2:
        description: '第 2 张截图：启动后等待秒数'
        required: false
        default: '45'

jobs:
  run:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project OneTapCountdown.xcodeproj \
            -target CountdownClock \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            SYMROOT="$GITHUB_WORKSPACE/SymBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Pick or create an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | .value[]
                      | select(.isAvailable == true)
                      | select(.name | test("^iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            RT=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.name | test("^iOS"))][-1].identifier')
            DT=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.identifier | test("iPhone-15"))][0].identifier')
            UDID=$(xcrun simctl create "CI iPhone" "$DT" "$RT")
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Install app
        run: |
          APP=$(find "$GITHUB_WORKSPACE/SymBuild" -type d -name "CountdownClock.app" | head -1)
          echo "app: $APP"
          xcrun simctl install booted "$APP"

      - name: Launch app
        run: |
          set +e
          ARGS=""
          if [ -n "${{ inputs.start_time }}" ]; then ARGS="$ARGS -start ${{ inputs.start_time }}"; fi
          if [ -n "${{ inputs.duration_min }}" ]; then ARGS="$ARGS -duration ${{ inputs.duration_min }}"; fi
          if [ "${{ inputs.auto_start }}" = "true" ]; then ARGS="$ARGS -autostart"; fi
          echo "launch args:$ARGS"
          # 后台启动，避免 simctl launch 阻塞；60 秒兜底超时
          ( xcrun simctl launch booted com.example.OneTapCountdown $ARGS > launch.log 2>&1 & echo $! > launch.pid )
          for i in $(seq 1 60); do
            if [ -s launch.log ]; then break; fi
            sleep 1
          done
          echo "--- launch.log ---"; cat launch.log; echo "------------------"

      - name: Screenshot 1
        run: |
          sleep "${{ inputs.wait1 || '4' }}"
          mkdir -p shots
          xcrun simctl io booted screenshot shots/shot1.png

      - name: Screenshot 2
        run: |
          sleep "${{ inputs.wait2 || '45' }}"
          xcrun simctl io booted screenshot shots/shot2.png

      - name: Publish artifacts to ci-artifacts branch
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git checkout -B ci-artifacts
          mkdir -p out
          [ -f shots/shot1.png ] && cp shots/shot1.png out/shot1.png
          [ -f shots/shot2.png ] && cp shots/shot2.png out/shot2.png
          [ -f build.log ] && cp build.log out/build.log
          git add -A out
          git commit -m "simulator run $GITHUB_RUN_ID" || echo "nothing to commit"
          git push -f origin ci-artifacts
