name: iOS Simulator Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project OneTapCountdown.xcodeproj \
            -target CountdownClock \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            SYMROOT="$GITHUB_WORKSPACE/SymBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Pick or create an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | .value[]
                      | select(.isAvailable == true)
                      | select(.name | test("^iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            RT=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.name | test("^iOS"))][-1].identifier')
            DT=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.identifier | test("iPhone-15"))][0].identifier')
            UDID=$(xcrun simctl create "CI iPhone" "$DT" "$RT")
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Install app
        run: |
          APP=$(find "$GITHUB_WORKSPACE/SymBuild" -type d -name "CountdownClock.app" | head -1)
          echo "app: $APP"
          xcrun simctl install booted "$APP"

      - name: Run UI test cases
        run: |
          set +e
          mkdir -p shots
          NOW=$(date +%s)
          fmt() { date -r "$1" +%H:%M; }
          S_DAY=$(fmt $((NOW+1800)))     # now + 30min（日间）
          S_M1=$(fmt $((NOW-60)))        # now - 1min
          S_M90=$(fmt $((NOW-90)))       # now - 90s
          S_M30=$(fmt $((NOW-1800)))     # now - 30min
          # 跨日结束时刻用例：开始 23:30（昨天），时长使结束时刻 ≈ now + 2h
          TODAY0=$(date -j -f "%Y-%m-%d %H:%M:%S" "$(date +%Y-%m-%d) 00:00:00" +%s)
          Y2330=$((TODAY0 - 1800))
          DUR2B=$(( (NOW + 7200 - Y2330) / 60 ))

          shoot() {
            name=$1; wait=$2; shift 2
            xcrun simctl terminate booted com.example.OneTapCountdown >/dev/null 2>&1
            sleep 1
            ( xcrun simctl launch booted com.example.OneTapCountdown "$@" >/dev/null 2>&1 & )
            sleep "$wait"
            xcrun simctl io booted screenshot "shots/$name.png"
            echo "shot: $name  args: $*"
          }

          echo "S_DAY=$S_DAY S_M1=$S_M1 S_M90=$S_M90 S_M30=$S_M30 DUR2B=$DUR2B"

          shoot 01-main-day          4  -start "$S_DAY"
          shoot 02-main-night        4  -start 02:30
          shoot 02b-crossday         4  -start 23:30 -duration "$DUR2B"
          shoot 03-input-mode        6  -start "$S_DAY" -inputmode keyboard
          shoot 04a-settings-interval 5 -sheet night
          shoot 04b-settings-duration  5 -sheet duration
          shoot 04c-settings-off     5  -sheet night -nightoff
          shoot 05-overtime          4  -start "$S_M30" -duration 5
          shoot 06-running           5  -start "$S_M1" -duration 2 -autostart
          shoot 07-finished          50 -start "$S_M90" -duration 2 -autostart
          shoot 08-custom-duration   4  -start "$S_DAY" -duration 90
          ls -l shots

      - name: Publish artifacts to ci-artifacts branch
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git checkout -B ci-artifacts
          mkdir -p out
          cp shots/*.png out/ 2>/dev/null || true
          [ -f build.log ] && cp build.log out/build.log
          git add -A out
          git commit -m "UI test shots run $GITHUB_RUN_ID" || echo "nothing to commit"
          git push -f origin ci-artifacts
